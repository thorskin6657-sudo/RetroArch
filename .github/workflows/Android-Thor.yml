name: Android Thor build

# Builds "RetroArch Thor": arm64, installs next to regular RetroArch,
# bottom-screen companion on by default. Run it from the Actions tab
# (Run workflow), then download the APK from the run's artifacts.

on:
  workflow_dispatch:
    inputs:
      hub_repo:
        description: 'Optional: GitHub repo with Thor Game Hub (owner/name) to bundle'
        required: false
        default: ''
      hub_module:
        description: 'Library module folder inside that repo (e.g. companion)'
        required: false
        default: ''
  push:
    branches: [thor-companion]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(github.event.inputs.hub_repo != '' && '["base","hub"]' || '["base"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v5

    - name: Check out Thor Game Hub
      if: matrix.bundle == 'hub'
      uses: actions/checkout@v5
      with:
        repository: ${{ github.event.inputs.hub_repo }}
        path: thorhub-src
        token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - uses: android-actions/setup-android@v3
    - name: Install Android build tools
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

    - name: Build RetroArch Thor
      env:
        BUNDLE: ${{ matrix.bundle }}
        HUB_MODULE: ${{ github.event.inputs.hub_module }}
      run: |
        cd pkg/android/phoenix
        HUB_ARGS=()
        if [ "$BUNDLE" = hub ]; then
          HUB_DIR="$(realpath -e "$GITHUB_WORKSPACE/thorhub-src/$HUB_MODULE")"
          case "$HUB_DIR" in "$GITHUB_WORKSPACE/thorhub-src"|"$GITHUB_WORKSPACE/thorhub-src/"*) ;; *) exit 1 ;; esac
          HUB_ARGS+=("-PthorHubDir=$HUB_DIR")
        fi
        set -o pipefail
        for i in 1 2 3; do
          ./gradlew assembleThorDebug "${HUB_ARGS[@]}" \
            -Dorg.gradle.internal.repository.max.tentatives=6 \
            -Dorg.gradle.internal.repository.initial.backoff=2000 \
            2>&1 | tee gradle.log && break
          grep -qE 'Could not (resolve|GET|HEAD|download)' gradle.log \
            && [ $i != 3 ] || exit 1
          echo "dependency fetch failed (attempt $i); retrying in 30s"
          sleep 30
        done
        find . -iname "*.apk" -exec ls -l "{}" \;

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-thor-${{ matrix.bundle }}-${{ github.sha }}
        path: pkg/android/phoenix/build/outputs/apk/thor/debug/phoenix-thor-debug.apk
        if-no-files-found: error
